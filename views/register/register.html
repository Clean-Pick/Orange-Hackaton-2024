<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <link href="../styles/register/register.css" rel="stylesheet"/>
    <title>Register - Animap</title>
</head>
<body>
<div class="container">
    <header>
        <div class="container__header">
            <div class="button__header">
                <p class="button__header__signin">Sign in</p>
                <p class="button__header__login">Login</p>
            </div>
            <div class="background__header"></div>
        </div>
    </header>

    <main>
        <section class="content__top__form">
            <h2>Welcome !</h2>
            <p>Ready to saves lives ?</p>
        </section>

        <section class="content__form">
            <form action="/animap/register" method="post">
                <input class="form__input__data" name="name_user" placeholder="Name" type="text"/>
                <input class="form__input__data" name="email_user" placeholder="Mail" type="text"/>
                <input class="form__input__data" name="telefone_user" placeholder="Phone number" type="text"/>
                <input class="form__input__data" name="password_user" placeholder="Password" type="password"/>
                <input class="form__input__submit" type="submit" value="Validate"/>
            </form>
        </section>
    </main>

    <!-- Conteneur pour le footer -->
    <div id="footer-placeholder"></div>
    <script src="../footer/loadFooter.js"></script>
</div>
</body>
</html>
